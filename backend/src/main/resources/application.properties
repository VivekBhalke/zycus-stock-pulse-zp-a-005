spring.application.name=vivek-bhalke
# DB
spring.datasource.url=jdbc:sqlite:stockpulse-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Custom path to access the raw JSON structure of your APIs
springdoc.api-docs.path=/api-docs

# Custom path to access the interactive web dashboard interface
springdoc.swagger-ui.path=/swagger-ui.html

# Logging Configuration
logging.level.com.stockpulse.ai.vivek_bhalke=DEBUG
logging.level.org.springframework.web=DEBUG

# LLM Configuration (for future use)
llm.provider=gemini
llm.api-key=${LLM_API_KEY:}
llm.model=gemini-1.5-flash
llm.base-url=https://generativelanguage.googleapis.com

# Strategy Configuration
commerce.strategy.default=RULE_BASED
